data_dir: "condition+monitoring+of+hydraulic+systems"

features:
  n_windows: 6

splits:
  seed: 42
  n_splits: 5
  purge_cycles: 10

models:
  seed: 42
  targets: ["valve", "pump", "accumulator"]
  schemes: ["random", "block_latin", "leave_period_out"]
  logreg_c: 0.1
  shallow_tree_depth: 4
  lightgbm_fixed:
    n_estimators: 120
    learning_rate: 0.05
    min_child_samples: 10
    subsample: 0.8
    subsample_freq: 1
    max_bin: 63
    n_jobs: 6
  lightgbm_grid:
    - {num_leaves: 7, colsample_bytree: 0.3}
    - {num_leaves: 7, colsample_bytree: 0.6}
    - {num_leaves: 15, colsample_bytree: 0.3}
    - {num_leaves: 15, colsample_bytree: 0.6}
  mlp:
    hidden: [128, 64]
    dropout: 0.2
    learning_rate: 0.001
    weight_decay: 0.001
    epochs: 60
    batch_size: 64
    threads: 4

robustness:
  noise_levels: [0.0, 0.05, 0.1, 0.25, 0.5, 1.0]
  seed: 42

xai:
  seed: 42
  contexts:
    - {name: valve_lopo, target: valve, scheme: leave_period_out, fold: 2}
    - {name: accumulator_lopo, target: accumulator, scheme: leave_period_out, fold: 2}
    - {name: accumulator_random, target: accumulator, scheme: random, fold: 0}
  n_test: 300
  n_background: 500
  n_lime: 40
  lime_samples: 1000
  lime_samples_high: 5000
  n_permutation_repeats: 3
  n_bootstrap_lightgbm: 5
  n_bootstrap_mlp: 3
  n_random_orders: 10
  top_k: 10
  ig_steps: 32
  deletion_feature_counts: [0, 1, 2, 5, 10, 20, 50, 100, 200, 510]
  retrain_sensor_counts: [1, 3, 5]
  expected_sensors:
    valve: [PS1, PS2, PS3, FS1]
    pump: [FS1, EPS1, PS1, SE]
    accumulator: [PS1, PS2, PS3, FS1]
  thermal_sensors: [TS1, TS2, TS3, TS4, CE, CP, PS5, PS6, FS2]

baseline:
  seed: 42
  variants: ["base", "stable_only", "no_ps4"]
  logreg_c: 0.1
  lightgbm:
    n_estimators: 150
    learning_rate: 0.05
    num_leaves: 15
    min_child_samples: 10
    colsample_bytree: 0.5
    subsample: 0.8
    subsample_freq: 1
    n_jobs: 4
